{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Recuperar Contraseña</h3>
                <form action="{{ url_for('recuperar_password') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico registrado</label>
                        <input type="email" name="correo" class="form-control" required placeholder="correo@ejemplo.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Número de Teléfono registrado</label>
                        <input type="text" name="telefono" class="form-control" required placeholder="999999999">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Solicitar Restablecimiento</button>
                </form>
                <hr class="my-4">
                <p class="text-center mb-0"><a href="{{ url_for('login') }}">Volver a Iniciar Sesión</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
