{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-secondary">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold text-success">Crear Cuenta</h3>
                <form action="{{ url_for('register') }}" method="POST" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label text-light">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control" required placeholder="Juan Pérez">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light">Correo Electrónico</label>
                        <input type="email" name="correo" class="form-control" required placeholder="correo@ejemplo.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light">Número de Teléfono <span class="text-muted">(Opcional)</span></label>
                        <input type="text" name="telefono" class="form-control" placeholder="999999999" autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light">Contraseña</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light">Código de Invitación <span class="text-muted">(Opcional)</span></label>
                        <input type="text" name="codigo_invitacion" class="form-control text-uppercase" placeholder="Ej. WIND-1-ABCD">
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3">Solicitar Registro</button>
                </form>
                <hr class="border-secondary my-4">
                <p class="text-center mb-0 text-light">¿Ya tienes cuenta? <a href="{{ url_for('login') }}" class="text-decoration-none text-info fw-bold">Inicia sesión</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
