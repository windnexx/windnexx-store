{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-secondary bg-dark text-light">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold" style="color: var(--accent-cyan);">Crear Cuenta</h3>
                
                <!-- Botón de Registro con Google (Estilo Visible) -->
                <a href="{{ url_for('login_google') }}" class="btn btn-outline-light w-100 fw-bold py-2 mb-3 shadow-sm d-flex align-items-center justify-content-center border-secondary" style="background-color: #212529; color: #ffffff;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-google me-2" viewBox="0 0 16 16">
                      <path d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.689 7.689 0 0 1 5.352 2.082l-2.284 2.284A4.347 4.347 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.792 4.792 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-7.648h-2.722v-2.9h5.536z"/>
                    </svg>
                    Registrarse con Google
                </a>

                <div class="text-center text-muted mb-3 small">O regístrate con tu correo</div>

                <form action="{{ url_for('register') }}" method="POST" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label text-light">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control bg-secondary text-light border-secondary" required placeholder="Juan Pérez">
                    </div>
                    
                    <!-- TELÉFONO ARRIBA Y CORREO ABAJO -->
                    <div class="mb-3">
                        <label class="form-label text-light">Número de Teléfono <span class="text-secondary">(Opcional)</span></label>
                        <input type="text" name="telefono" class="form-control bg-secondary text-light border-secondary" placeholder="999999999" autocomplete="new-password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">Correo Electrónico</label>
                        <input type="email" name="correo" class="form-control bg-secondary text-light border-secondary" required placeholder="correo@ejemplo.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">Contraseña</label>
                        <input type="password" name="password" class="form-control bg-secondary text-light border-secondary" required placeholder="••••••••">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light">Código de Invitación <span class="text-secondary">(Opcional)</span></label>
                        <input type="text" name="codigo_invitacion" class="form-control bg-secondary text-light border-secondary text-uppercase" placeholder="Ej. WIND-1-ABCD">
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3 shadow">Solicitar Registro</button>
                </form>
                <hr class="border-secondary my-4" style="opacity: 0.2;">
                <p class="text-center mb-0 text-light">¿Ya tienes cuenta? <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold" style="color: var(--accent-cyan);">Inicia sesión</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
